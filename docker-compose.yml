services:
  identity-service:
    build:
      context: .
      args:
        MODULE: identity-service
    environment:
      IDENTITY_DB_URL: jdbc:postgresql://postgres:5432/identity
      CUSTOMER_SERVICE_BASE_URL: http://customer-service:8082
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      customer-service:
        condition: service_started

  customer-service:
    build:
      context: .
      args:
        MODULE: customer-service
    environment:
      CUSTOMER_DB_URL: jdbc:postgresql://postgres:5432/customer
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy

  banking-service:
    build:
      context: .
      args:
        MODULE: banking-service
    environment:
      BANKING_DB_URL: jdbc:postgresql://postgres:5432/banking
      CUSTOMER_SERVICE_BASE_URL: http://customer-service:8082
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      customer-service:
        condition: service_started

  transfer-service:
    build:
      context: .
      args:
        MODULE: transfer-service
    environment:
      TRANSFER_DB_URL: jdbc:postgresql://postgres:5432/transfer
      BANKING_SERVICE_BASE_URL: http://banking-service:8083
      EXCHANGE_RATE_SERVICE_BASE_URL: http://exchange-rate-service:8085
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      banking-service:
        condition: service_started
      exchange-rate-service:
        condition: service_started

  exchange-rate-service:
    build:
      context: .
      args:
        MODULE: exchange-rate-service
    environment:
      EXCHANGE_RATE_API_KEY: ${EXCHANGE_RATE_API_KEY:-}
    ports:
      - "8085:8085"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro

  eureka-server:
    build:
      context: ./eureka-server
    environment:
      SERVER_PORT: 8761
    ports:
       - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
