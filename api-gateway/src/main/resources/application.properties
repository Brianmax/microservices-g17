spring.application.name=api-gateway
server.port=8080
eureka.client.enabled=true
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=never
management.endpoint.gateway.access=read-only

spring.cloud.gateway.server.webflux.routes[0].id=identity-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://identity-service:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/auth/**,/api/v1/security/**

spring.cloud.gateway.server.webflux.routes[1].id=banking-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://banking-service:8083
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/accounts/**,/api/v1/users/*/accounts,/api/v1/transactions/*,/api/v1/internal/accounts/*,/api/v1/internal/postings

spring.cloud.gateway.server.webflux.routes[2].id=customer-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://customer-service:8082
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/customers/**

spring.cloud.gateway.server.webflux.routes[3].id=transfer-service
spring.cloud.gateway.server.webflux.routes[3].uri=http://transfer-service:8084
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/v1/transfers,/api/v1/transfers/**

spring.cloud.gateway.server.webflux.routes[4].id=exchange-rate-service
spring.cloud.gateway.server.webflux.routes[4].uri=http://exchange-rate-service:8085
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/v1/exchange-rates/**,/api/v1/internal/exchange-rates/**
