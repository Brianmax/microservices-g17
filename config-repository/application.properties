management.endpoints.web.exposure.include=health,info,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=never
eureka.client.enabled=true
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.cloud.circuitbreaker.bulkhead.resilience4j.enabled=false
services.http.connect-timeout=1s
services.http.read-timeout=3s
resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.slow-call-duration-threshold=3s
resilience4j.circuitbreaker.configs.default.slow-call-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s

resilience4j.circuitbreaker.configs.default.record-exceptions[0]=java.util.concurrent.TimeoutException
resilience4j.circuitbreaker.configs.default.record-exceptions[1]=org.springframework.web.client.ResourceAccessException